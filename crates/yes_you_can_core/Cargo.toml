[package]
name = "yes-you-can-core"
version = "0.1.0"
edition = "2021"
authors = ["CAZE7 <info@arena.ai>"]
description = "Reference ISO-TP framing, signal statistics and write-safety typestate for yes-you-CAN "
  "(reference/experimental: not built, not tested and not imported by the platform — see README.md)"
license = "MIT"

[dependencies]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
