{
  "schemaVersion": 2,
  "description": "The one source of the architecture rule and the AI context layer (AGENTS 28, master backlog P0 #2, ADR 0031/0042/0043). Read by tools/architecture/check-dependencies.mjs (fails the build on a forbidden edge), tools/architecture/ai-context.mjs (generates the .ai/generated/<topic>-context.md bundles), tests/architecture (keeps both tools honest). Nothing else may restate these edges or these layer assignments — a second copy is a second rule. Format: this file is written in JSON syntax, which is valid YAML 1.2, so it parses with Node's built-in JSON.parse without any runtime dependency (ADR 0002) and with any YAML reader at the same time. If you need YAML comments or flow style, you need a parser, and a parser is a dependency.",
  "layers": {
    "foundation": "Shared primitives and the DOM-free chart core. Nothing may sit below this layer; these packages import nothing.",
    "contract": "Pure data contracts and projections (domain model, diagnostic IR, definitions). No I/O, no protocol, no transport, no node builtins — that is what makes them the stable middle.",
    "application": "Commands, queries and actions: the vocabulary of what a client may ask the platform to do. Speaks domain only.",
    "protocol": "Diagnostic protocol logic (UDS ISO 14229, KWP2000, OEM hooks) that speaks through a link seam, never through a bus or adapter.",
    "transport": "Frame layer (CAN), segmentation (ISO-TP ISO 15765-2) and the DoIP link (ISO 13400). Below protocols, above adapters.",
    "adapter": "Hardware and interface adapters that implement the CanBus contract. Hardware specifics stay here and nowhere else.",
    "core": "The diagnostic engine: session, discovery, DTC scan/track, measurement, write port. The widest package below runtime.",
    "runtime": "The composition root: domain services, command/query handlers, domain events, audit. Headless — no HTTP, DOM or UI toolkit.",
    "persistence": "Session persistence, versioned migrations and export formats. The only layer below the app that touches files.",
    "presentation": "Charts and reports: rendering what the core produced. They read the diagnostic IR and domain views; they never reach a vehicle.",
    "ai": "Analysis providers: they read the diagnostic IR (evidence set, hypotheses) and nothing else. An analysis proposes; the write chain decides.",
    "ui": "The workbench application. The app depends on the layers, never the other way round.",
    "tool": "Development and QA tools (simulators, golden sessions, trace analyzer, definition importer). A tool, not a layer: nothing imports them."
  },
  "packages": {
    "@vdp/shared": {
      "layer": "foundation",
      "mayImport": [],
      "why": "Foundation: no dependencies at all."
    },
    "@vdp/charts": {
      "layer": "foundation",
      "mayImport": [],
      "why": "DOM-free chart core; knows its own types and nothing else."
    },
    "@vdp/protocols-oem": {
      "layer": "protocol",
      "mayImport": [],
      "why": "Manufacturer hook types and registry; fills gaps, depends on nothing."
    },
    "@vdp/domain": {
      "layer": "contract",
      "mayImport": ["@vdp/shared"],
      "why": "Domain contracts: shared primitives only — never protocols, transports or I/O."
    },
    "@vdp/diagnostic-ir": {
      "layer": "contract",
      "mayImport": ["@vdp/shared"],
      "why": "The diagnostic IR: observations with provenance between raw protocol form and projections. It knows no protocol, no transport and no I/O — that is what makes it the stable middle (P0 #6)."
    },
    "@vdp/application": {
      "layer": "application",
      "mayImport": ["@vdp/domain"],
      "why": "Application layer: commands/queries/actions speak domain only."
    },
    "@vdp/definitions": {
      "layer": "contract",
      "mayImport": ["@vdp/shared"],
      "why": "Definitions are data + validation; no diagnostic logic."
    },
    "@vdp/transport-can": {
      "layer": "transport",
      "mayImport": ["@vdp/shared"],
      "why": "Frame layer; nothing below it."
    },
    "@vdp/transport-iso-tp": {
      "layer": "transport",
      "mayImport": ["@vdp/shared", "@vdp/transport-can"],
      "why": "Segmentation sits on frames."
    },
    "@vdp/transport-doip": {
      "layer": "transport",
      "mayImport": ["@vdp/shared", "@vdp/transport-can"],
      "why": "DoIP presents itself as a CAN-like link; it never pulls in the protocol layer."
    },
    "@vdp/protocols-uds": {
      "layer": "protocol",
      "mayImport": ["@vdp/shared"],
      "why": "Speaks through a link interface, never through a bus or adapter."
    },
    "@vdp/protocols-kwp2000": {
      "layer": "protocol",
      "mayImport": ["@vdp/shared", "@vdp/protocols-uds"],
      "why": "Legacy ECUs share the UDS primitives."
    },
    "@vdp/adapter-generic-can": {
      "layer": "adapter",
      "mayImport": ["@vdp/shared", "@vdp/transport-can"],
      "why": "Adapter implements the bus contract; hardware specifics stay here."
    },
    "@vdp/adapter-elm327": {
      "layer": "adapter",
      "mayImport": ["@vdp/shared", "@vdp/transport-can"],
      "why": "Serial ELM327 protocol and stream belong to the adapter."
    },
    "@vdp/adapter-canable": {
      "layer": "adapter",
      "mayImport": ["@vdp/shared", "@vdp/transport-can", "@vdp/adapter-elm327"],
      "why": "CANable reuses the ELM327 stream/protocol."
    },
    "@vdp/adapter-socketcan": {
      "layer": "adapter",
      "mayImport": ["@vdp/shared", "@vdp/transport-can"],
      "why": "Native SocketCAN binding."
    },
    "@vdp/adapter-host": {
      "layer": "adapter",
      "mayImport": [
        "@vdp/shared",
        "@vdp/transport-can",
        "@vdp/adapter-canable",
        "@vdp/adapter-elm327",
        "@vdp/adapter-socketcan"
      ],
      "why": "Host bindings (tty, bindings loader) and the side-effect-free probe catalog."
    },
    "@vdp/core": {
      "layer": "core",
      "mayImport": [
        "@vdp/shared",
        "@vdp/diagnostic-ir",
        "@vdp/definitions",
        "@vdp/protocols-uds",
        "@vdp/protocols-oem",
        "@vdp/transport-can",
        "@vdp/transport-iso-tp"
      ],
      "why": "The diagnostic core: protocols + transports + definitions (still the widest package below runtime)."
    },
    "@vdp/runtime": {
      "layer": "runtime",
      "mayImport": [
        "@vdp/shared",
        "@vdp/diagnostic-ir",
        "@vdp/domain",
        "@vdp/application",
        "@vdp/core",
        "@vdp/definitions",
        "@vdp/protocols-uds",
        "@vdp/transport-can",
        "@vdp/transport-doip"
      ],
      "why": "Composition root: wires the transport seam, so it may reach the concrete transports while domain/application stay free of them."
    },
    "@vdp/storage": {
      "layer": "persistence",
      "mayImport": ["@vdp/shared", "@vdp/core"],
      "why": "Persistence and export formats below the runtime."
    },
    "@vdp/reports": {
      "layer": "presentation",
      "mayImport": ["@vdp/core", "@vdp/diagnostic-ir"],
      "why": "Report rendering prints what the core produced — and reads the diagnostic IR directly, because a section that shows an unproven statement has to use the IR's own evidence words instead of restating them (P0 #6, ADR 0037)."
    },
    "@vdp/ai": {
      "layer": "ai",
      "mayImport": ["@vdp/shared", "@vdp/diagnostic-ir"],
      "why": "Provider abstraction stays orthogonal to diagnostics: it may read observations and their evidence — the diagnostic IR, which names no transport, no protocol and no write — and nothing above it. That is the machine-checked form of „an analysis provider never touches the vehicle“ (AGENTS 22, P0 #16/#39, ADR 0038)."
    },
    "@vdp/simulators": {
      "layer": "tool",
      "mayImport": [
        "@vdp/shared",
        "@vdp/core",
        "@vdp/definitions",
        "@vdp/protocols-uds",
        "@vdp/transport-can",
        "@vdp/transport-iso-tp"
      ],
      "why": "Virtual vehicle answers like a real ECU stack."
    },
    "@vdp/golden-sessions": {
      "layer": "tool",
      "mayImport": [
        "@vdp/shared",
        "@vdp/diagnostic-ir",
        "@vdp/definitions",
        "@vdp/transport-can",
        "@vdp/transport-iso-tp",
        "@vdp/core",
        "@vdp/simulators"
      ],
      "why": "Recorded sessions plus their expectation: it records against the simulator, replays through the real core and compares in the IR vocabulary. A tool, not a layer — nothing imports it."
    },
    "@vdp/trace-analyzer": {
      "layer": "tool",
      "mayImport": ["@vdp/shared", "@vdp/definitions", "@vdp/protocols-uds", "@vdp/transport-can"],
      "why": "Offline trace tooling decodes with the protocol layer, without the core."
    },
    "@vdp/definition-importer": {
      "layer": "tool",
      "mayImport": ["@vdp/shared", "@vdp/definitions"],
      "why": "Imports definition data; validation is the definitions package."
    },
    "@vdp/web": {
      "layer": "ui",
      "mayImport": [
        "@vdp/shared",
        "@vdp/domain",
        "@vdp/application",
        "@vdp/runtime",
        "@vdp/diagnostic-ir",
        "@vdp/definitions",
        "@vdp/protocols-uds",
        "@vdp/transport-can",
        "@vdp/storage",
        "@vdp/reports",
        "@vdp/ai",
        "@vdp/simulators",
        "@vdp/adapter-host"
      ],
      "why": "The workbench speaks to the vehicle exclusively through the runtime (command/query bus). It reads the diagnostic IR to hand the evidence set to an analysis provider: restating evidence vocabulary in the app would put a second copy of the claim's source where the IR already says it (P0 #6/#39, ADR 0037/0038)."
    },
    "@vdp/formal-conformance": {
      "layer": "tool",
      "mayImport": ["@vdp/shared", "@vdp/core", "@vdp/transport-can", "@vdp/transport-iso-tp"],
      "why": "Runs the shared test vectors against the production TypeScript (ISO-TP transport, write-safety chain) and compares both sides with the Haskell reference. A tool, not a layer — nothing imports it; it may reach core and the transports because its whole job is to drive them. (ADR 0045)"
    }
  },
  "rules": {
    "nodeBuiltins": {
      "allowedIn": ["@vdp/adapter-host", "@vdp/storage", "@vdp/web", "@vdp/golden-sessions", "@vdp/formal-conformance"],
      "why": "Portable layers (domain, application, protocols, transports, core, runtime) must stay free of node:fs and sockets; file system and host bindings belong to storage, host adapters and apps. @vdp/golden-sessions is a tool, not a layer — nothing imports it, and its CLI is the part that reads and writes the fixture files on disk. @vdp/formal-conformance is a tool whose CLI reads the vector files and runs the Haskell toolchain — the same file-and-process boundary golden-sessions owns, for the same reason (ADR 0045)."
    },
    "ui": {
      "package": "@vdp/web",
      "why": "No package imports the UI — the app depends on the layers, never the other way round."
    },
    "layerRules": [
      {
        "from": "@vdp/protocols",
        "forbidden": ["@vdp/adapter"],
        "why": "Protocols speak through a link, never through an adapter."
      },
      {
        "from": "@vdp/transport",
        "forbidden": ["@vdp/protocols"],
        "why": "Transports are the frame layer; protocols sit above them."
      },
      {
        "from": "@vdp/adapter",
        "forbidden": ["@vdp/protocols", "@vdp/core"],
        "why": "Hardware specifics stay below protocols and the core."
      }
    ],
    "portableLayers": [
      {
        "packages": ["@vdp/domain", "@vdp/application"],
        "forbidden": [
          "@vdp/protocols",
          "@vdp/transport",
          "@vdp/adapter",
          "@vdp/core",
          "@vdp/runtime",
          "@vdp/storage"
        ],
        "why": "Domain and application stay protocol-, transport- and I/O-free (AGENTS 1, 3)."
      }
    ]
  },
